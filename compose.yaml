services:
  db:
    image: postgres:18
    environment:
      # Superuser: only used by the init script to create roles. The service never uses it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: ledger
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-owner-dev-only}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:-app-dev-only}
    ports:
      # Bound to loopback only: the dev passwords are public, so never expose this to a network.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./docker/roles:/docker-roles:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies migrations as the owner role, then exits. The only service that
  # is given the owner credentials.
  migrate:
    build: .
    image: ledger:local
    command: ["python", "-m", "ledger.migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_OWNER_URL: postgresql://ledger_owner:${LEDGER_OWNER_PASSWORD:-owner-dev-only}@db:5432/ledger

  app:
    build: .
    image: ledger:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_APP_URL: postgresql://ledger_app:${LEDGER_APP_PASSWORD:-app-dev-only}@db:5432/ledger
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  pgdata:
