name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the older run for that PR. Pushes to main each get their
# own group (the commit SHA), so those runs are never cancelled or replaced while queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_OWNER_URL: postgresql://ledger_owner:owner-ci-only@localhost:5432/ledger
      DATABASE_APP_URL: postgresql://ledger_app:app-ci-only@localhost:5432/ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # --locked fails if uv.lock is out of date with pyproject.toml; --frozen would not notice.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run sqlfluff lint migrations/
      # Service containers skip the docker init scripts, so run the same role setup by hand. It
      # also creates the separate database the tests run against (ledger_test).
      - name: Create database roles
        run: |
          psql -v ON_ERROR_STOP=1 \
            -v dbname=ledger -v testdbname=ledger_test \
            -v owner_password=owner-ci-only -v app_password=app-ci-only \
            -f docker/roles/roles.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres-ci-only
          PGDATABASE: ledger

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=markdown-append:$GITHUB_STEP_SUMMARY


  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: docker compose up --build --wait

      - name: Check the app answers and can reach Postgres
        run: >-
          curl --fail --silent --show-error
          --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors
          http://127.0.0.1:8000/health

      - name: Create an account and read its balance
        run: |
          set -eu
          created=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"account_name": "smoke:alice", "currency": "USD"}' \
            http://127.0.0.1:8000/accounts)
          echo "$created"
          id=$(echo "$created" | jq -r .id)
          balance=$(curl --fail --silent --show-error "http://127.0.0.1:8000/accounts/${id}/balance")
          echo "$balance"
          echo "$balance" | jq -e '.currency == "USD" and .balance_minor == 0'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
