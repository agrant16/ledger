[project]
name = "ledger"
version = "0.1.0"
description = "A double-entry ledger service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "psycopg-pool",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "locust",
    # Required by FastAPI's TestClient.
    "httpx2",
    "pytest-cov",
]

[tool.uv]
# An application, not a library: run from src/ via pythonpath instead of installing it.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ledger"]
branch = true

[tool.coverage.report]
show_missing = true
# Enforced in CI (`pytest --cov`). A safety net against untested code, not a goal in itself:
# the invariant, property-based and concurrency tests are the evidence of correctness.
# Set just below the measured baseline; raise it as the ledger code lands.
fail_under = 85

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
