[project]
name = "ledger"
version = "0.1.0"
description = "A double-entry ledger service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "psycopg-pool",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "locust",
    # Required by FastAPI's TestClient.
    "httpx2",
    "pytest-cov",
    "sqlfluff",
    "pytest-timeout",
]

[tool.uv]
# An application, not a library: run from src/ via pythonpath instead of installing it.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A test that hangs (a deadlock, a lock that is never released) stops the run after 30 seconds
# with the stack of every thread, instead of waiting for the CI job's 10-minute limit. The
# "thread" method behaves the same on Windows and Linux. A test that needs longer says so with
# @pytest.mark.timeout(seconds).
timeout = 30
timeout_method = "thread"

[tool.coverage.run]
source = ["src/ledger"]
branch = true

[tool.coverage.report]
show_missing = true
# Enforced in CI (`pytest --cov`). A safety net against untested code, not a goal in itself:
# the invariant, property-based and concurrency tests are the evidence of correctness.
# Set a couple of points below the measured baseline (about 97% in milestone 3), so a real drop
# fails while a small refactor does not; raise it when the baseline rises.
fail_under = 95

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# PLC0415: no imports outside the top of a file. A late import needs a `# noqa: PLC0415` and a
# comment saying why (a circular import, a patch target, or import timing that the test checks).
# The same rule is stated in CLAUDE.md (Working style).
# PLR0913: at most 4 arguments per function in `src/`. Tests are exempt (see `per-file-ignores`),
# because pytest fixtures take one argument per fixture they use.
select = ["E", "F", "I", "B", "UP", "PLC0415", "PLR0913"]

[tool.ruff.lint.pylint]
max-args = 4

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.ruff.lint.isort]
# Named explicitly so that import sorting never depends on which modules exist on disk (ruff's cache
# and a half-finished move both made the local result differ from CI's).
known-first-party = ["ledger", "tests"]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "raw"
sql_file_exts = ".sql"
